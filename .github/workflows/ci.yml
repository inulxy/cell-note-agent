name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run heavy bioinformatics integration job"
        type: boolean
        default: false

jobs:
  # Lightweight gate: focused Python dependencies, runs on every push/PR.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unit-test dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy pandas scipy
      - name: Compile check
        run: python -m compileall -q cell_note_agent sc_epi_curator scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: External skill registry validation
        run: python -m cell_note_agent.external_skills validate
      - name: Offline crawler demo
        run: ./cell-note demo --out runs/ci-crawl --run-id ci-crawl
      - name: Toy handoff (demo_pbmc -> cards -> validate -> package)
        run: |
          python scripts/demo_pbmc.py --stage all --dataset_id toy_pbmc --results_root runs/ci-demo
          python scripts/package_peak_matrices.py --stage cards --results_root runs/ci-demo
          python scripts/package_peak_matrices.py --stage validate --results_root runs/ci-demo
          python scripts/package_peak_matrices.py --stage package --results_root runs/ci-demo

  # Heavy integration: real fixtures through all three ATAC pipelines.
  # Manual trigger only (workflow_dispatch with run_integration=true).
  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-snapatac2.yml
          init-shell: bash
          cache-environment: true
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-curator.yml
          init-shell: bash
          cache-environment: true
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-muon.yml
          init-shell: bash
          cache-environment: true
      - name: Fetch golden fixtures
        run: ./fixtures/fetch_fixtures.sh
      - name: Prepare references (resource-setup)
        run: |
          python3 scripts/prepare_references.py --stage plan --out reference/
          python3 scripts/prepare_references.py --stage fetch --out reference/
          python3 scripts/prepare_references.py --stage verify --out reference/
      - name: Fragment pipeline (9 stages, default thresholds + blacklist gate)
        shell: bash -el {0}
        run: |
          for s in import pre-filter filter embed cluster doublet call-peaks make-peak-matrix finalize; do
            micromamba run -n snapatac2 python scripts/scatac_fragment_qc.py --stage "$s" \
              --dataset_id fixture_fragments \
              --fragments fixtures/scatac_pbmc500_downsample.fragments.tsv.gz \
              --genome_build GRCh38 --results_root runs/ci-frag \
              --blacklist_bed reference/hg38-blacklist.v2.bed
          done
      - name: Peak-matrix pipeline (6 stages)
        shell: bash -el {0}
        run: |
          for s in load profile filter standardize embed-cluster finalize; do
            micromamba run -n cellnote-curator python scripts/scatac_peak_matrix.py --stage "$s" \
              --dataset_id fixture_pm \
              --matrix fixtures/multiome_pbmc3k_arc.filtered_feature_bc_matrix.h5 \
              --genome_build GRCh38 --results_root runs/ci-pm
          done
      - name: Multiome pipeline (5 stages)
        shell: bash -el {0}
        run: |
          for s in pair-check qc-rna qc-atac intersect finalize; do
            micromamba run -n muon python scripts/multiome_qc.py --stage "$s" \
              --dataset_id fixture_mo \
              --rna fixtures/multiome_pbmc3k_arc.filtered_feature_bc_matrix.h5 \
              --atac_matrix fixtures/multiome_pbmc3k_arc.filtered_feature_bc_matrix.h5 \
              --genome_build GRCh38 --results_root runs/ci-mo
          done
      - name: Package chains must validate
        run: |
          for root in runs/ci-frag runs/ci-pm runs/ci-mo; do
            python scripts/package_peak_matrices.py --stage cards --results_root "$root"
            python scripts/package_peak_matrices.py --stage validate --results_root "$root"
            python scripts/package_peak_matrices.py --stage package --results_root "$root"
          done
