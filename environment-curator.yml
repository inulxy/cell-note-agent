# CellNote curator env: light matrix QC (scatac_peak_matrix), packaging,
# crawler, web app, and the stdlib test suite.
# Direct-dependency pins verified against PyPI on 2026-08-08.
# NOTE (Ceph workspace): create envs on the LOCAL disk, e.g.
#   MAMBA_ROOT_PREFIX=$HOME/micromamba micromamba create -y -f environment-curator.yml
name: cellnote-curator
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - scanpy==1.12.3
      - anndata==0.13.2
      - numpy>=2,<3
      - scipy>=1.13,<2
      - pandas>=2.3,<3
      - h5py>=3.11,<4
      - matplotlib>=3.10,<4
      - igraph>=0.11,<1
      - leidenalg>=0.10,<1
      # hg19->hg38 peak liftover at scatac_peak_matrix standardize
      - pyliftover==0.4.1
      # web MVP (cell_note_agent/web)
      - fastapi>=0.115,<1
      - uvicorn>=0.30,<1
      - pydantic>=2.7,<3
